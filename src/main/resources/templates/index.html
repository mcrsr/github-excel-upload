<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Automation Input Portal</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success {
            margin-top: 25px;
            padding: 20px;
            background: #ecfdf5;
            border: 1px solid #10b981;
            border-radius: 5px;
        }

        .error {
            margin-top: 25px;
            padding: 20px;
            background: #fef2f2;
            border: 1px solid #ef4444;
            border-radius: 5px;
        }

        .execution-id {
            font-weight: bold;
            font-size: 18px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Automation Input Portal</h1>

    <form method="POST"
          action="/upload"
          enctype="multipart/form-data">

        <table>
            <tr>
                <th>
                    <label for="environment">Environment:</label>
                </th>
                <td>
                    <select id="environment" name="environment" required>
                        <option value="">-- Select Environment --</option>
                        <option value="E2E1">E2E1</option>
                        <option value="E2E2">E2E2</option>
                        <option value="QA">QA</option>
                        <option value="UAT">UAT</option>
                        <option value="PROD">PROD</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>
                    <label>Select Excel File</label>
                </th>
                <td>
                    <input type="file"
                           name="file"
                           accept=".xlsx,.xls"
                           required>
                </td>
            </tr>
        </table>
        <button type="submit">
            Upload & Commit
        </button>

    </form>


    <div th:if="${success == true}"
         class="success">

        <h3>✅ Upload Successful</h3>

        <p>
            <strong>Execution ID:</strong>
            <span class="execution-id"
                  th:text="${executionId}">
            </span>
        </p>

        <p>
            <strong>File:</strong>
            <span th:text="${fileName}">
            </span>
        </p>

        <p th:text="${message}">
        </p>

    </div>


    <div th:if="${success == false}"
         class="error">

        <h3>❌ Upload Failed</h3>

        <p th:text="${message}">
        </p>

    </div>

</div>

</body>

</html>
